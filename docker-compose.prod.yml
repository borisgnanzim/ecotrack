services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ecotrack_bootstrap}
    # Plus de port public : accessible uniquement depuis les autres conteneurs
    # du même réseau docker (service-users, service-containers, etc.).
    # Si tu as besoin d'un accès ponctuel depuis ta machine (ex: pgAdmin),
    # ouvre un tunnel SSH plutôt que d'exposer le port :
    #   ssh -L 5432:localhost:5432 user@ton-droplet
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecotrack_bootstrap}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    expose:
      - "2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    restart: unless-stopped
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    # Kafka n'a besoin d'être joignable que par les services internes.
    # On retire complètement le listener PLAINTEXT_HOST public.
    expose:
      - "29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
    restart: unless-stopped
    networks:
      - backend

  # Outils d'admin (kafka-ui, redis-commander) : profil "tools", désactivés
  # par défaut en prod. Pour les lancer ponctuellement :
  #   docker compose --profile tools up -d
  # et y accéder via un tunnel SSH, jamais en les exposant publiquement.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    depends_on:
      - kafka
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ecotrack
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped
    networks:
      - backend

  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: ["tools"]
    depends_on:
      - redis
    ports:
      - "127.0.0.1:${REDIS_COMMANDER_PORT:-8081}:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - backend

  service-users:
    build:
      context: ./backend/service-users
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    expose:
      - "3011"
    environment:
      PORT: 3011
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ecotrack_service_users?schema=public
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      NOTIFICATION_MODE: local
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required, e.g. https://admin.tondomaine.com,https://citoyen.tondomaine.com}
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]
    restart: unless-stopped
    networks:
      - backend

  service-containers:
    build:
      context: ./backend/service-containers
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    expose:
      - "3012"
    environment:
      PORT: 3012
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ecotrack_containers?schema=public
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]
    restart: unless-stopped
    networks:
      - backend

  service-routes:
    build:
      context: ./backend/service-routes
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    expose:
      - "3013"
    environment:
      PORT: 3013
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ecotrack_routes?schema=public
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]
    restart: unless-stopped
    networks:
      - backend

  service-analytics:
    build:
      context: ./backend/service-analytics
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    expose:
      - "3014"
    environment:
      PORT: 3014
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ecotrack_analytics?schema=public
      KAFKA_BROKERS: kafka:29092
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]
    restart: unless-stopped
    networks:
      - backend

  service-gamification:
    build:
      context: ./backend/service-gamification
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    expose:
      - "3015"
    environment:
      PORT: 3015
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ecotrack_gamification?schema=public
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]
    restart: unless-stopped
    networks:
      - backend

  service-iot:
    build:
      context: ./backend/service-iot
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    expose:
      - "3016"
    environment:
      PORT: 3016
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/ecotrack_iot?schema=public
      KAFKA_BROKERS: kafka:29092
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]
    restart: unless-stopped
    networks:
      - backend

  service-api-gateway:
    build:
      context: ./backend/service-api-gateway
    depends_on:
      service-users:
        condition: service_started
      service-containers:
        condition: service_started
      service-routes:
        condition: service_started
      service-analytics:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Seul le gateway a besoin d'être joignable depuis l'extérieur du host,
    # et encore : on le bind sur 127.0.0.1, c'est le reverse proxy (Caddy/
    # Nginx) qui écoutera sur 80/443 et fera suivre en interne.
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      PORT: 3010
      USERS_SERVICE_URL: http://service-users:3011
      USERS_SERVICE_PORT: 3011
      CONTAINERS_SERVICE_URL: http://service-containers:3012
      CONTAINERS_SERVICE_PORT: 3012
      ROUTES_SERVICE_URL: http://service-routes:3013
      ROUTES_SERVICE_PORT: 3013
      ANALYTICS_SERVICE_URL: http://service-analytics:3014
      ANALYTICS_SERVICE_PORT: 3014
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NODE_ENV: production
      CLUSTER_WORKERS: 2
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1h
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    restart: unless-stopped
    networks:
      - backend

  ecotrack-admin:
    build:
      context: ./front/ecotrack-admin-vjs
      args:
        # Doit pointer vers l'URL PUBLIQUE du gateway (via ton reverse proxy),
        # jamais localhost, sinon le build embarque la mauvaise URL dans le
        # bundle JS statique.
        VITE_APP_BACK_API_GATEWAY: ${PUBLIC_API_URL:?PUBLIC_API_URL is required, e.g. https://api.tondomaine.com}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - service-api-gateway
    restart: unless-stopped
    networks:
      - backend

  ecotrack-citoyen:
    build:
      context: ./front/ecotrack-citoyen-vjs
      args:
        VITE_APP_BACK_API_GATEWAY: ${PUBLIC_API_URL:?PUBLIC_API_URL is required, e.g. https://api.tondomaine.com}
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - service-api-gateway
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:

networks:
  backend:
    name: ecotrack-network
    driver: bridge